[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riskgraph"
version = "0.1.0"
description = "Multi-tier supplier risk: n-tier expansion, hidden sub-tier dependencies, SPOF ranking and disruption simulation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sumeet" }]
keywords = [
    "supply-chain",
    "supplier-risk",
    "multi-tier",
    "graph-analysis",
    "monte-carlo",
    "resilience",
    "concentration-risk",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.24",
    "networkx>=3.0",
    "pydantic>=2.0",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/echosumeet/supplier-risk-graph"
Source = "https://github.com/echosumeet/supplier-risk-graph"

[project.scripts]
riskgraph = "riskgraph.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
