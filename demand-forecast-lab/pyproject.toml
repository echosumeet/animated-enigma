[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dflab"
version = "0.1.0"
description = "Benchmarking harness for intermittent and hierarchical demand forecasting"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sumeet" }]
keywords = [
    "forecasting",
    "demand-planning",
    "supply-chain",
    "intermittent-demand",
    "croston",
    "hierarchical-forecasting",
    "reconciliation",
    "mint",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/echosumeet/demand-forecast-lab"
Source = "https://github.com/echosumeet/demand-forecast-lab"

[project.scripts]
dflab = "dflab.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 92
target-version = "py310"
