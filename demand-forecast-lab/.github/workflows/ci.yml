name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Smoke-test the CLI
        run: |
          python -m dflab classify --products 2 --regions 2 --channels 2 \
            --periods 140 --horizon 6 --windows 2
          python -m dflab backtest --products 2 --regions 2 --channels 2 \
            --periods 150 --horizon 6 --step 6 --windows 1 --min-train 130 --no-ml

      - name: Quick benchmark
        if: matrix.python-version == '3.11'
        run: python benchmarks/run_benchmarks.py --quick --no-figures
