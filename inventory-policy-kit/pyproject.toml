[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invkit"
version = "0.1.0"
description = "Safety stock, replenishment policies, and multi-echelon inventory optimization"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sumeet" }]
keywords = [
    "inventory",
    "supply-chain",
    "safety-stock",
    "newsvendor",
    "multi-echelon",
    "operations-research",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
figures = ["matplotlib>=3.7", "networkx>=3.0"]

[project.scripts]
invkit = "invkit.cli:main"

[project.urls]
Homepage = "https://github.com/echosumeet/inventory-policy-kit"
Source = "https://github.com/echosumeet/inventory-policy-kit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
invkit = ["py.typed"]
