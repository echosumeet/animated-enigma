name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[figures]"

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Benchmarks (quick mode)
        run: python benchmarks/run_benchmarks.py --quick --gap-sample 100

      - name: Example
        run: python examples/slot_and_route.py

      - name: Figure
        run: python benchmarks/make_figure.py
