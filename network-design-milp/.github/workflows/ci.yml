name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[figures]"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run examples
        run: |
          for f in examples/*.py; do
            echo "--- $f"
            python "$f" > /dev/null
          done

      - name: Run benchmarks
        run: python benchmarks/run_benchmarks.py > /dev/null

      - name: Regenerate figures
        run: python benchmarks/make_figures.py

      - name: Check the committed benchmark results are current
        run: |
          git diff --stat -- benchmarks/results.md
          git diff --quiet -- benchmarks/results.md \
            || echo "benchmark output drifted (wall-clock timings differ across runners)"
