[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netdesign"
version = "0.1.0"
description = "Supply chain network design and flow optimization with mixed-integer programming"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sumeet" }]
keywords = [
    "supply-chain",
    "network-design",
    "facility-location",
    "mixed-integer-programming",
    "stochastic-programming",
    "operations-research",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
]

[project.optional-dependencies]
figures = ["matplotlib>=3.7"]

[project.scripts]
netdesign = "netdesign.cli:main"

[project.urls]
Homepage = "https://github.com/echosumeet/network-design-milp"
Source = "https://github.com/echosumeet/network-design-milp"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
netdesign = ["py.typed"]
