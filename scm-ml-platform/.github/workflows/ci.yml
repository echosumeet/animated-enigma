name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Point-in-time audit must be clean
        run: python -m scmplatform --skus 10 --days 320 audit

      - name: Backtest release gate
        run: python -m scmplatform --skus 30 --days 480 backtest --folds 3

      - name: Quick benchmark
        if: matrix.python-version == '3.11'
        run: python benchmarks/run_benchmarks.py --quick --no-figures
